<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniPol</title>
    <!-- the cdn: the design system and the libraries (import 'cdn/...'); index.php fills in its url -->
    <link rel="stylesheet" href="{{CDN_URL}}/design/main.css">
    <script type="importmap">{ "imports": { "cdn/": "{{CDN_URL}}/lib/" } }</script>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <header class="site-kop">
        <!-- to the product page, from where everything is reachable; index.php fills in its url -->
        <a class="site-titel" href="{{WWW_URL}}/">MiniPol</a>
        <!-- the title of the gesprek on its pages, see js/kop.js -->
        <span class="site-gesprek" id="site-gesprek" hidden></span>
    </header>

    <!-- views are loaded from views/<id>.html when first shown, see js/views.js -->
    <main></main>

    <div class="stelling-tooltip" id="stelling-tooltip" role="tooltip" hidden></div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
