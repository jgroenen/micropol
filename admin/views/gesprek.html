<section id="gesprek" class="view" hidden>
    <a class="terug" href="#/">← Alle gesprekken</a>
    <h1 class="pagina-titel" id="gesprek-titel"></h1>
    <p class="melding" id="gesprek-melding" role="status" hidden></p>
    <p class="gesprek-info" id="gesprek-info"></p>

    <form class="beheer-formulier gesprek-formulier" id="gesprek-formulier" hidden>
        <h2>Gegevens</h2>
        <p class="melding fout" id="gesprek-fout" role="alert" hidden></p>
        <label for="gesprek-titel-veld">Titel</label>
        <input id="gesprek-titel-veld" name="titel" maxlength="200" required>
        <label for="gesprek-omschrijving">Omschrijving <span>(optioneel)</span></label>
        <textarea id="gesprek-omschrijving" name="omschrijving" rows="3" maxlength="1000"></textarea>
        <fieldset class="keuze">
            <legend>Stellingen van deelnemers</legend>
            <label><input type="radio" name="moderatie" value="achteraf"> Direct tonen, achteraf afkeuren</label>
            <label><input type="radio" name="moderatie" value="vooraf"> Pas tonen na goedkeuring</label>
        </fieldset>
        <button type="submit" class="knop" id="gesprek-knop">Opslaan</button>
    </form>

    <!-- see js/stellingen.js -->
    <section class="beheer-stellingen" id="beheer-stellingen" hidden>
        <div class="stellingen-kop">
            <h2>Stellingen</h2>
            <label>Toon
                <select id="stellingen-filter">
                    <option value="alle">alle</option>
                    <option value="te-beoordelen">te beoordelen</option>
                    <option value="zichtbaar">zichtbaar</option>
                    <option value="afgekeurd">afgekeurd</option>
                </select>
            </label>
        </div>
        <p class="melding fout" id="stellingen-fout" role="alert" hidden></p>
        <ul class="beheer-lijst" id="stellingen-lijst"></ul>
        <p class="leeg-tekst" id="stellingen-leeg" hidden>Geen stellingen.</p>
    </section>
</section>
