<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>MiniPol beheer</title>
    <!-- the cdn: the design system and the libraries (import 'cdn/...'); index.php fills in its url -->
    <link rel="stylesheet" href="{{CDN_URL}}/design/main.css">
    <script type="importmap">{ "imports": { "cdn/": "{{CDN_URL}}/lib/" } }</script>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <header class="site-kop">
        <!-- to the product page, from where everything is reachable; index.php fills in its url -->
        <div class="site-naam">
            <a class="site-titel" href="{{WWW_URL}}/">MiniPol <span class="beheer-label">beheer</span></a>
            <!-- who is logged in, below the name -->
            <span class="ingelogd-als" id="ingelogd-als" hidden></span>
        </div>
        <div class="ingelogd" id="ingelogd" hidden>
            <!-- on a phone the menu is behind this button, see js/main.js -->
            <button type="button" class="menu-openen" id="menu-openen" aria-expanded="false" aria-controls="ingelogd-menu" aria-label="Menu">
                <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <div class="ingelogd-menu" id="ingelogd-menu">
                <nav class="beheer-menu" id="beheer-menu" aria-label="Beheer">
                    <a href="#/" id="menu-gesprekken">Gesprekken</a>
                    <a href="#/superbeheerders" id="menu-superbeheerders" hidden>Superbeheerders</a>
                </nav>
                <button class="link-knop" id="uitloggen">Uitloggen</button>
            </div>
        </div>
    </header>

    <!-- views are loaded from views/<id>.html when first shown, see js/views.js -->
    <main></main>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
